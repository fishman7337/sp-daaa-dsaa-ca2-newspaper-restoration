[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-dsaa-newspaper-restoration"
version = "0.1.0"
description = "ST1507 CA2 newspaper restoration CLI using prefix tries."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Goh Kun Ming" },
    { name = "Goh Jenson" },
]
keywords = [
    "data-structures",
    "prefix-trie",
    "text-restoration",
    "singapore-polytechnic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing",
]
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7.10",
    "pip-audit>=2.7.3",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6.9",
]

[project.scripts]
newspaper-restoration = "newspaper_restoration.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
